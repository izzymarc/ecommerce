version: '3.8'
services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  server:
    build: ./server
    ports: ["5000:5000"]
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
      - REDIS_URL=redis://redis:6379
    depends_on: [mongodb, redis]
volumes:
  mongodb_data:
